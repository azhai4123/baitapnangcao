<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Lập phiếu mượn')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('loans')}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>
<main class="container page-shell">
    <div class="page-heading"><div><p class="eyebrow">Giao dịch mới</p><h1>Lập phiếu mượn</h1></div></div>
    <form class="form-panel" th:action="@{/borrowings}" th:object="${borrowingForm}" method="post">
        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger" role="alert">
            <p class="mb-0" th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>
        </div>
        <div class="row g-3 mb-4">
        <div class="col-12 col-md-7"><label class="form-label" for="memberId">Thành viên</label>
        <select class="form-select" id="memberId" th:field="*{memberId}"
                th:classappend="${#fields.hasErrors('memberId')} ? ' is-invalid' : ''">
            <option value="">-- Chọn thành viên --</option>
            <option th:each="member : ${members}" th:value="${member.id}"
                    th:text="${member.fullName + ' (' + member.email + ')'}"></option>
        </select>
        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('memberId')}" th:errors="*{memberId}"></div></div>

        <div class="col-12 col-md-5"><label class="form-label" for="dueDate">Hạn trả</label>
        <input class="form-control" id="dueDate" type="date" th:field="*{dueDate}" required
               th:classappend="${#fields.hasErrors('dueDate')} ? ' is-invalid' : ''">
        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('dueDate')}" th:errors="*{dueDate}"></div></div>
        </div>

        <section class="mb-4">
            <div class="d-flex justify-content-between align-items-center gap-3 mb-3"><h2 class="section-title mb-0">Sách cần mượn</h2>
                <button class="btn btn-sm btn-outline-success" id="add-item" type="button">Thêm dòng sách</button></div>
            <div id="item-rows" class="d-grid gap-3">
            <div class="item-row row g-3" th:each="item, stat : *{items}">
                <div class="col-12 col-md-8"><label class="form-label" th:for="${'book-' + stat.index}">Đầu sách</label>
                <select class="form-select" th:id="${'book-' + stat.index}"
                        th:field="*{items[__${stat.index}__].bookId}">
                    <option value="">-- Chọn sách --</option>
                    <option th:each="book : ${books}" th:value="${book.id}"
                            th:text="${book.title + ' — còn ' + book.availableQuantity}"></option>
                </select>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('items[' + stat.index + '].bookId')}"
                     th:errors="*{items[__${stat.index}__].bookId}"></div></div>
                <div class="col-12 col-md-4"><label class="form-label" th:for="${'quantity-' + stat.index}">Số lượng</label>
                <input class="form-control" th:id="${'quantity-' + stat.index}"
                       type="number" min="1" step="1"
                       th:field="*{items[__${stat.index}__].quantity}">
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('items[' + stat.index + '].quantity')}"
                     th:errors="*{items[__${stat.index}__].quantity}"></div></div>
            </div>
            </div>
            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('items')}" th:errors="*{items}"></div>
        </section>

        <div class="mb-4"><label class="form-label" for="notes">Ghi chú</label>
            <textarea class="form-control" id="notes" th:field="*{notes}" maxlength="1000" rows="3"></textarea></div>
        <div class="d-flex flex-wrap gap-2"><button class="btn btn-primary" type="submit">Xác nhận mượn</button>
            <a class="btn btn-outline-secondary" th:href="@{/borrowings}">Hủy</a></div>
    </form>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script>
    document.getElementById('add-item').addEventListener('click', function () {
        const rows = document.getElementById('item-rows');
        const index = rows.querySelectorAll('.item-row').length;
        const row = rows.querySelector('.item-row').cloneNode(true);
        row.querySelectorAll('p').forEach(function (error) { error.remove(); });
        row.querySelectorAll('[name]').forEach(function (field) {
            field.name = field.name.replace('items[0]', 'items[' + index + ']');
            field.value = '';
        });
        row.querySelectorAll('[id]').forEach(function (field) {
            field.id = field.id.replace('-0', '-' + index);
        });
        row.querySelectorAll('label[for]').forEach(function (label) {
            label.htmlFor = label.htmlFor.replace('-0', '-' + index);
        });
        rows.appendChild(row);
    });
</script>
</body>
</html>
