<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Thanh toán phí phạt')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('loans')}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>
<main class="container page-shell">
    <div class="page-heading"><div><p class="eyebrow" th:text="${'Phiếu #' + borrowing.id}"></p><h1>Thanh toán phí phạt</h1></div></div>
    <div class="summary-tile mb-4"><span class="label">Còn phải thu</span>
        <span class="value" th:text="${#numbers.formatDecimal(borrowing.unpaidFineAmount, 0, 'COMMA', 0, 'POINT') + ' ₫'}"></span></div>
    <form class="form-panel" th:action="@{/borrowings/{id}/payments(id=${borrowing.id})}" th:object="${paymentForm}" method="post">
        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger" role="alert">
            <p class="mb-0" th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p></div>
        <div class="row g-3">
            <div class="col-12 col-md-6"><label class="form-label" for="amount">Số tiền thanh toán</label>
                <input class="form-control" id="amount" type="number" min="1" step="1" th:field="*{amount}"
                       th:classappend="${#fields.hasErrors('amount')} ? ' is-invalid' : ''">
                <div class="invalid-feedback d-block" th:errors="*{amount}"></div></div>
            <div class="col-12 col-md-6"><label class="form-label" for="method">Phương thức</label>
                <select class="form-select" id="method" th:field="*{method}"
                        th:classappend="${#fields.hasErrors('method')} ? ' is-invalid' : ''">
                    <option value="">Chọn phương thức</option><option value="CASH">Tiền mặt</option>
                    <option value="BANK_TRANSFER">Chuyển khoản</option><option value="CARD">Thẻ</option>
                </select><div class="invalid-feedback d-block" th:errors="*{method}"></div></div>
            <div class="col-12"><label class="form-label" for="note">Ghi chú</label>
                <textarea class="form-control" id="note" th:field="*{note}" maxlength="500" rows="3"></textarea>
                <div class="invalid-feedback d-block" th:errors="*{note}"></div></div>
        </div>
        <div class="d-flex flex-wrap gap-2 mt-4"><button class="btn btn-primary" type="submit">Ghi nhận thanh toán</button>
            <a class="btn btn-outline-secondary" th:href="@{/borrowings/{id}(id=${borrowing.id})}">Quay lại phiếu</a></div>
    </form>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
